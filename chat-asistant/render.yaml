services:
  - type: web
    name: vegetai-api
    runtime: python
    region: ohio  # o frankfurt, oregon, singapore
    plan: free  # o starter, professional
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: true
    branch: asistente